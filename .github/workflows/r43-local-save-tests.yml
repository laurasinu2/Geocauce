name: R43 local persistence regression
on:
  push:
    branches: [fix/r43-local-save-verification-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-local-save:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check frontend/app.js
          node --check frontend/sw.js
      - name: Local save safety regression tests
        run: node --test frontend/tests/project-create-save.test.cjs
