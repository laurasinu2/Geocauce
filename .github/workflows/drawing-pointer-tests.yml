name: Drawing pointer regression
on:
  push:
    branches: [fix/section-notebook-pointer-coordinates]
  pull_request:
    paths:
      - 'app.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/drawing-pointer-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
