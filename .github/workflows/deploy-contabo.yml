name: Deploy Geocauce to Contabo (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirma el despliegue de R49 al VPS'
        required: true
        type: choice
        default: 'NO'
        options:
          - 'NO'
          - 'DESPLEGAR'
      db_password_action:
        description: 'Password mismatch: KEEP stops; ROTATE_EXISTING backs up and changes the existing PostgreSQL role password'
        required: true
        type: choice
        default: 'KEEP'
        options:
          - 'KEEP'
          - 'ROTATE_EXISTING'

permissions:
  contents: read

concurrency:
  group: geocauce-contabo-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact branch and source
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit confirmation and R49 branch
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "DESPLEGAR" ]]; then
            echo "::error::Selecciona DESPLEGAR para confirmar el despliegue."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/fix/r49-recovery-healthcheck-20261114" ]]; then
            echo "::error::Elige la rama fix/r49-recovery-healthcheck-20261114 en Run workflow (no main)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify monorepo and source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f compose.yaml
          test -f backend/geocauce_api/app.py
          test -f frontend/index.html
          test -f scripts/deploy-contabo.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-test.txt
          cd backend
          PYTHONPATH=. python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend syntax and auth contract tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-contabo.sh
          node --check frontend/app.js
          node --check frontend/sw.js
          node --test \
            frontend/tests/api-auth.test.cjs \
            frontend/tests/project-create-save.test.cjs \
            frontend/tests/first-selfhosted-sync.test.cjs \
            frontend/tests/selfhosted-blob-integrity.test.cjs
      - name: Docker Compose configuration
        shell: bash
        env:
          POSTGRES_USER: geocauce
          POSTGRES_PASSWORD: ci-placeholder-password
          JWT_SECRET: ci-placeholder-signing-key
          SITE_ADDRESS: geocauce.example.org
        run: |
          set -euo pipefail
          docker compose config --quiet

  deploy:
    name: Upload verified source and deploy through password SSH
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SSH password client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Transfer source and deploy on VPS
        shell: bash
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PASSWORD_ACTION: ${{ inputs.db_password_action }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CONTABO_PASSWORD: ${{ secrets.CONTABO_PASSWORD }}
          CONTABO_SSH_FINGERPRINT: ${{ secrets.CONTABO_SSH_FINGERPRINT }}
          GEOCAUCE_SITE_ADDRESS: ${{ secrets.GEOCAUCE_SITE_ADDRESS || vars.GEOCAUCE_SITE_ADDRESS }}
          CONTABO_SSH_PORT: ${{ secrets.CONTABO_SSH_PORT || vars.CONTABO_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          for name in CONTABO_HOST CONTABO_USER CONTABO_PASSWORD CONTABO_SSH_FINGERPRINT GEOCAUCE_SITE_ADDRESS DB_USERNAME DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Falta $name. Configúralo en Settings > Secrets and variables > Actions del repositorio."
              exit 1
            fi
          done
          [[ "$DB_PASSWORD_ACTION" == "KEEP" || "$DB_PASSWORD_ACTION" == "ROTATE_EXISTING" ]] || { echo "::error::Unexpected database password action."; exit 1; }
          [[ "$DB_USERNAME" =~ ^[a-z_][a-z0-9_]{0,62}$ ]] || { echo "::error::DB_USERNAME must be a lowercase PostgreSQL identifier."; exit 1; }
          [[ -n "$DB_PASSWORD" && "$(printf '%s' "$DB_PASSWORD" | wc -l)" -eq 0 ]] || { echo "::error::DB_PASSWORD must not be empty or multiline."; exit 1; }
          [[ "$CONTABO_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo "::error::Host SSH no válido"; exit 1; }
          [[ "$CONTABO_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::Usuario SSH no válido"; exit 1; }
          [[ "$CONTABO_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Puerto SSH no válido"; exit 1; }
          # Accept hostname, https://hostname or https://hostname/ from a
          # repository secret or a repository variable. Never print its value.
          site="$GEOCAUCE_SITE_ADDRESS"
          site="${site#https://}"
          site="${site#http://}"
          site="${site%/}"
          [[ "$site" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$ && "$site" == *.* ]] || {
            echo "::error::GEOCAUCE_SITE_ADDRESS debe ser un hostname DNS sin ruta, por ejemplo geocauce.duckdns.org."
            exit 1
          }
          GEOCAUCE_SITE_ADDRESS="$site"
          [[ "$CONTABO_SSH_FINGERPRINT" =~ ^SHA256:[a-zA-Z0-9+/]{43}$ ]] || {
            echo "::error::El fingerprint SSH debe tener formato SHA256:..."; exit 1;
          }

          ssh_dir="$RUNNER_TEMP/geocauce-ssh"
          install -d -m 700 "$ssh_dir"
          known_hosts="$ssh_dir/known_hosts"
          # SSH public host key is fetched, but trusted ONLY if it matches the
          # independently verified, pinned fingerprint saved in GitHub Secrets.
          ssh-keyscan -T 15 -t ed25519 -p "$CONTABO_SSH_PORT" "$CONTABO_HOST" \
            2>/dev/null > "$known_hosts"
          [[ -s "$known_hosts" ]] || { echo "::error::SSH no responde o no publica Ed25519"; exit 1; }
          actual="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | head -n1)"
          [[ "$actual" == "$CONTABO_SSH_FINGERPRINT" ]] || {
            echo "::error::La huella SSH del VPS NO coincide. Se cancela el despliegue."; exit 1;
          }
          chmod 600 "$known_hosts"

          ssh_args=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive
                    -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1
                    -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts"
                    -o ConnectTimeout=20)
          target="${CONTABO_USER}@${CONTABO_HOST}"
          # sshpass -e reads the masked password from the environment, never from
          # a command-line argument, release archive or shell transcript.
          export SSHPASS="$CONTABO_PASSWORD"
          short_sha="${GITHUB_SHA:0:12}"
          archive="$RUNNER_TEMP/geocauce-${short_sha}.tar.gz"
          remote_archive="/opt/geocauce/incoming/geocauce-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${short_sha}.tar.gz"
          remote_creds="/opt/geocauce/incoming/db-credentials-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${short_sha}.txt"

          # Whitelist: never transfer .env, local backups, IndexedDB, credentials or git internals.
          tar -czf "$archive" \
            compose.yaml frontend backend infra scripts docs README.md .env.example
          sshpass -e ssh "${ssh_args[@]}" -p "$CONTABO_SSH_PORT" "$target" \
            "install -d -m 700 /opt/geocauce/incoming"
          sshpass -e scp "${ssh_args[@]}" -P "$CONTABO_SSH_PORT" "$archive" "$target:$remote_archive"
          # Create a temporary private credentials file on the VPS via verified SSH.
          # Never put DB secrets into command arguments, logs, Git or the release tar.
          # A failed deploy must remove it as well.
          cleanup_secret() {
            sshpass -e ssh "${ssh_args[@]}" -p "$CONTABO_SSH_PORT" "$target" \
              "rm -f '$remote_creds'" >/dev/null 2>&1 || true
          }
          trap cleanup_secret EXIT
          printf '%s\n%s\n' "$DB_USERNAME" "$DB_PASSWORD" | \
            sshpass -e ssh "${ssh_args[@]}" -p "$CONTABO_SSH_PORT" "$target" \
            "umask 077; cat > '$remote_creds'; chmod 600 '$remote_creds'"
          sshpass -e ssh "${ssh_args[@]}" -p "$CONTABO_SSH_PORT" "$target" \
            "bash -s -- '$GITHUB_SHA' '$remote_archive' '$GEOCAUCE_SITE_ADDRESS' '$remote_creds' '$DB_PASSWORD_ACTION'" < scripts/deploy-contabo.sh
          trap - EXIT
          cleanup_secret
          unset SSHPASS

          echo "### Contabo deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: deployment and HTTPS health checks completed" >> "$GITHUB_STEP_SUMMARY"
