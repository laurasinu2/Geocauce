name: R46 password deploy safety checks
on:
  push:
    branches: [fix/r46-password-deploy-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell syntax and no insecure SSH host-check bypass
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-contabo.sh
          if grep -q 'StrictHostKeyChecking=no' .github/workflows/deploy-contabo.yml; then
            echo 'Insecure SSH host checking is forbidden'
            exit 1
          fi
          grep -q 'sshpass -e' .github/workflows/deploy-contabo.yml
          grep -q 'CONTABO_SSH_FINGERPRINT' .github/workflows/deploy-contabo.yml
          grep -q 'Never regenerate credentials' scripts/deploy-contabo.sh
          python -m pip install -q pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/deploy-contabo.yml', encoding='utf-8'))"
      - name: Frontend tests
        run: |
          node --check frontend/app.js
          node --check frontend/sw.js
          node --test frontend/tests/api-auth.test.cjs frontend/tests/project-create-save.test.cjs frontend/tests/first-selfhosted-sync.test.cjs frontend/tests/selfhosted-blob-integrity.test.cjs
      - name: Backend tests
        shell: bash
        run: |
          python -m pip install -q -r backend/requirements-test.txt
          cd backend
          PYTHONPATH=. python -m pytest -q tests
      - name: Docker Compose validation
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
          JWT_SECRET: ci-placeholder-signing-key
          SITE_ADDRESS: geocauce.example.org
        run: docker compose config --quiet
