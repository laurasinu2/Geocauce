name: geocauce
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: geocauce
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/geocauce/db-password:/run/secrets/db_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Falta usuario} -d geocauce"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [private]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: geocauce
      DB_USER: ${POSTGRES_USER:?Falta usuario}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-16777216}
      FILE_ROOT: /data/files
    volumes:
      - files_data:/data/files
      - /opt/geocauce/db-password:/run/secrets/db_password:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    security_opt: [no-new-privileges:true]
  adminer:
    image: adminer:5
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    security_opt: [no-new-privileges:true]
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Define SITE_ADDRESS en .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [private]
    security_opt: [no-new-privileges:true]
networks:
  private:
volumes:
  postgres_data:
  files_data:
  caddy_data:
  caddy_config:
